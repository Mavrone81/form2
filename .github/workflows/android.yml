name: Android

# Builds a signed release APK for the PM Records Flutter app.
#
# Triggers: pushing a tag matching `apk-*` (e.g. `apk-1.0.0`) builds, tests,
# and attaches the APK to a GitHub release for that tag; workflow_dispatch
# lets someone build on demand (e.g. to sanity-check signing) without
# needing a tag. Unlike ci.yml this does not run on every push/PR: a Gradle
# + Flutter release build is slow and the signing secrets should only be
# exercised deliberately.
on:
  push:
    tags:
      - 'apk-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only needed so the final step can attach the APK to a GitHub
      # release; everything else in this job is read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets are present
        # Belt 1 of 2 against a silent debug-signed release. A missing or
        # typo'd secret name isn't a hard error on its own -- `${{ secrets.X
        # }}` for an unset X just interpolates to an empty string, so
        # `echo "" | base64 -d` decodes to an empty (or garbage) keystore
        # file, `hasReleaseSigning` in build.gradle.kts goes false, and the
        # release build type silently falls back to debug signing -- which
        # is the correct behaviour for local dev (see the comment there) but
        # must never happen here, where the result gets uploaded as a
        # workflow artifact and, on a tag push, attached to a public
        # release. Fail fast, before spending any build time, and name only
        # which secret(s) are missing -- never their values.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_B64"
          [ -z "$KEYSTORE_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASS"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing ANDROID_KEY_PASS"
          if [ -n "$missing" ]; then
            echo "::error::Missing/empty repo secret(s):$missing -- refusing to build (this would otherwise silently fall back to debug signing)."
            exit 1
          fi
          echo "All four signing secrets are present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the Android app's PDF engine
        # The bundle is a build artefact and is gitignored (see
        # mobile/pdf-engine/dist/ in .gitignore), so it has to be built here
        # or test/pdf-engine-golden.test.js skips -- and that test is the
        # only thing holding the app's offline preview to being the same
        # bytes as the archived record. Its own npm project, same as ci.yml.
        run: |
          npm ci --prefix mobile/pdf-engine
          node mobile/pdf-engine/build.mjs

      - name: Stage the PDF engine into the app's assets
        # pubspec.yaml's flutter.assets lists these three paths, but none of
        # them is committed (mobile/app/.gitignore ignores
        # /assets/pdf-engine/) -- they're staged here from mobile/pdf-engine/
        # before flutter test/build ever run, exactly the way the pubspec.yaml
        # comment above that assets block says this step must happen.
        run: |
          mkdir -p mobile/app/assets/pdf-engine/dist
          cp mobile/pdf-engine/harness.html mobile/app/assets/pdf-engine/harness.html
          cp mobile/pdf-engine/harness.js mobile/app/assets/pdf-engine/harness.js
          cp mobile/pdf-engine/dist/pdf-engine.js mobile/app/assets/pdf-engine/dist/pdf-engine.js

      - name: Run server tests
        # GitHub's default shell is `bash -e`, NOT `-o pipefail`: without
        # this, the step exits with `tail`'s status (always 0) and a
        # failing suite goes green. Same discipline as ci.yml's "Run tests"
        # step, verified there against a deliberately failing test. Also
        # tees to a file like ci.yml does, rather than piping straight to
        # `tail`, so a failure's full output isn't lost to the 20-line
        # truncation in the log -- see the "Upload full server test log on
        # failure" step below.
        shell: bash
        run: |
          set -o pipefail
          node --test 2>&1 | tee test-output.txt | tail -20

      - name: Upload full server test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-log
          path: test-output.txt
          retention-days: 30

      - name: Guard against committed form content and signing material
        run: npm run check:sensitive

      - run: flutter pub get
        working-directory: mobile/app

      - run: flutter test
        working-directory: mobile/app

      - run: flutter analyze
        working-directory: mobile/app

      - name: Decode release keystore
        # ANDROID_KEYSTORE_B64 is the release keystore, base64-encoded, held
        # as a GitHub secret -- it never enters the repo (see
        # scripts/check-no-sensitive-files.sh and android/.gitignore).
        # Decoded to $RUNNER_TEMP, which GitHub Actions wipes at the end of
        # the job.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/pmrecords-release.keystore"

      - name: Build signed release APK
        working-directory: mobile/app
        env:
          # Read by android/app/build.gradle.kts's release signingConfig.
          # When these are unset (local dev), that config falls back to
          # debug signing instead -- see the comment there.
          KEYSTORE_PATH: ${{ runner.temp }}/pmrecords-release.keystore
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: flutter build apk --release

      - name: Verify the APK is signed with the release key, not debug
        # Belt 2 of 2. The secrets-present check earlier only proves the
        # four env vars were non-empty -- it can't prove the base64 decoded
        # to a valid keystore, that the passwords/alias were actually
        # correct for it, or that it's the *expected* keystore. Any of
        # those failing silently degrades signingConfig back to debug (see
        # build.gradle.kts) or produces an APK Gradle happily calls "signed"
        # under the wrong identity. Actually inspect the built APK's
        # certificate before it goes anywhere near an artifact upload or a
        # public release.
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi
          apk="mobile/app/build/app/outputs/flutter-apk/app-release.apk"
          certs="$("$APKSIGNER" verify --print-certs "$apk")"
          echo "$certs"
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is signed with the Android DEBUG key, not the release keystore -- refusing to publish it."
            exit 1
          fi
          if ! echo "$certs" | grep -q 'CN=PM Records'; then
            echo "::error::APK signer CN is not 'PM Records' as expected -- refusing to publish an unexpectedly-signed APK."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pmrecords-release-apk
          path: mobile/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the tag's GitHub release
        # Only on the tag trigger, not on workflow_dispatch runs (those have
        # no tag to attach to). softprops/action-gh-release creates the
        # release for the pushed tag if it doesn't already exist, and
        # uploads the APK as its asset.
        if: startsWith(github.ref, 'refs/tags/apk-')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/build/app/outputs/flutter-apk/app-release.apk
