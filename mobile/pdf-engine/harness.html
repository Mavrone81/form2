<!doctype html>
<meta charset="utf-8">
<title>PDF engine harness</title>
<!--
  The page the Android app loads into a hidden WebView to render a preview of
  a record while the tablet is offline.

  It is deliberately almost empty. Everything it can do is in dist/pdf-engine.js
  — the server's own renderer, bundled — and this file is only the doorway:
  a record arrives as a message, the PDF goes back as base64. No network, no
  storage, no styling worth the name; if this page ever grows logic of its own,
  that logic is by definition something the archived record does not have.

  Both scripts are external files, and nothing here is inline, so the app can
  serve this page under a strict `script-src 'self'` policy without needing
  'unsafe-inline' or a nonce.

  Protocol
  --------
  in   { type: 'render', id?: any, record: object | string }
  out  { type: 'rendered', id, pdf: <base64 string>, bytes: <number> }
       { type: 'error',    id, message: string }
       { type: 'ready' }                       (posted once, on load)

  `record` is exactly what server/pdf-record.js's renderRecordPdf takes.

  Messages are accepted only from this page's own origin — which for a page
  loaded from app assets is '' or 'null' — and replies are addressed back to
  the sender rather than broadcast, because a reply carries the finished
  record: signatories' names and their signature ink. Replies also go to a
  Flutter JavaScript channel called PdfEngine if the host has bound one, and
  to this window itself, so a browser tab opened by hand can see them too.
  Sending to whichever of the three exists means the harness does not have to
  know what kind of host it is running under.

  A render that somehow fails to finish is answered with an `error` reply
  after 30 seconds rather than left silent — see harness.js.
-->
<body>
<pre id="status">loading…</pre>
<script src="dist/pdf-engine.js"></script>
<script src="harness.js"></script>
</body>
